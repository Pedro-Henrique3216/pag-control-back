spring:
  datasource:
    url: jdbc:h2:mem:pagcontroldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  mail:
    host: localhost
    port: 1025
    username:
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: WARN

api:
  security:
    token:
      secret: mysecrettokenforjwtsigning

email:
  retry:
    max-attempts: 3
    delay: 0
  confirmation-url: "http://localhost:8080/api/users/confirm?token="