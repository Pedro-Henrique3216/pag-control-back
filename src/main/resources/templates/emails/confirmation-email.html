<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Confirmação de Cadastro</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f4;font-family:Arial, Helvetica, sans-serif;">

<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f4f4f4;padding:40px 0;">
    <tr>
        <td align="center">

            <table role="presentation" width="600" cellspacing="0" cellpadding="0"
                   style="background:#ffffff;border-radius:8px;padding:40px;">

                <tr>
                    <td align="center">
                        <h2 style="margin:0;color:#333333;">
                            Olá, <span th:text="${name}">Usuário</span>!
                        </h2>
                    </td>
                </tr>

                <tr>
                    <td style="padding-top:20px;color:#555555;font-size:16px;line-height:24px;">
                        Obrigado por criar sua conta.
                        Para finalizar seu cadastro, clique no botão abaixo:
                    </td>
                </tr>

                <tr>
                    <td align="center" style="padding:35px 0;">
                        <a th:href="${confirmationLink}"
                           style="background:#2563eb;
                                  color:#ffffff;
                                  text-decoration:none;
                                  padding:14px 28px;
                                  border-radius:6px;
                                  font-weight:bold;
                                  display:inline-block;">
                            Confirmar Cadastro
                        </a>
                    </td>
                </tr>

                <tr>
                    <td style="color:#666666;font-size:14px;">
                        Se o botão não funcionar, copie e cole o link abaixo no seu navegador:
                    </td>
                </tr>

                <tr>
                    <td style="padding-top:10px;">
                        <a th:href="${confirmationLink}"
                           th:text="${confirmationLink}"
                           style="color:#2563eb;word-break:break-all;">
                        </a>
                    </td>
                </tr>

                <tr>
                    <td style="padding-top:30px;color:#999999;font-size:13px;">
                        Se você não realizou este cadastro, basta ignorar este e-mail.
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
